<!DOCTYPE html>
<!--
  Waqar Sayyed — personal portfolio
  Copyright (C) 2026 Waqar Sayyed

  A modified port of developerFolio (Copyright (C) saadpasta and the
  developerFolio contributors, https://github.com/saadpasta/developerFolio),
  which is GPL-3.0. Its stylesheet, element structure, five Lottie scenes, five
  SVGs and both fonts originate there; three further Lottie scenes are under
  the Lottie Simple License, which conflicts with GPL-3.0 and is knowingly
  accepted. Read the full inventory before redistributing this tree.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Duplicated in portfolio.js's `meta` on purpose: render.js rewrites
         these at runtime, but a social unfurler executes no JavaScript and
         reads only what is literally here. Change one, change the other. -->
    <title>Waqar Sayyed — Full-Stack Developer</title>
    <meta name="title" content="Waqar Sayyed — Full-Stack Developer" />
    <meta
      name="description"
      content="Back-end focused full-stack developer building enterprise systems that businesses depend on daily. C#, .NET Core, ASP.NET Core, SQL Server, DevExpress."
    />
    <meta name="author" content="Waqar Sayyed" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Waqar Sayyed — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Back-end focused full-stack developer building enterprise systems that businesses depend on daily. C#, .NET Core, ASP.NET Core, SQL Server, DevExpress."
    />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Waqar Sayyed — Full-Stack Developer" />
    <meta
      property="twitter:description"
      content="Back-end focused full-stack developer building enterprise systems that businesses depend on daily. C#, .NET Core, ASP.NET Core, SQL Server, DevExpress."
    />

    <!-- The only three lines that hardcode the published address; every asset
         path is relative. Absolute and with the trailing slash, both required
         by unfurlers. Renaming the repository is a three-line edit. -->
    <link rel="canonical" href="https://waqarsyd.github.io/portfolio/" />
    <meta property="og:url" content="https://waqarsyd.github.io/portfolio/" />
    <meta property="twitter:url" content="https://waqarsyd.github.io/portfolio/" />

    <!-- Absolute and PNG, both required by unfurlers. The card is generated by
         tools/make-preview.py; these dimensions must match the file. -->
    <meta property="og:image" content="https://waqarsyd.github.io/portfolio/images/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Waqar Sayyed — Full-Stack Developer. C#, .NET Core, ASP.NET Core, SQL Server, DevExpress." />
    <meta property="twitter:image" content="https://waqarsyd.github.io/portfolio/images/preview.png" />

    <meta name="theme-color" content="#6c63ff" />

    <!-- One of the page's two network requests; the other is the Twemoji PNGs
         render.js substitutes. Everything else is local, and both degrade to
         text rather than breaking offline. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.15.4/css/all.min.css"
    />

    <!-- Fonts are self-hosted, deliberately not Google Fonts: Agustina is not
         published there, and only one Montserrat weight ships, so bold is
         synthesised. -->
    <link rel="stylesheet" href="styles.css" />

    <!-- A file rather than a data: URI — an inline SVG would carry raw < and >
         inside a URL, which makes a file:// page log "Unsafe attempt to load
         URL" against its own address. Regenerate rather than hand-edit it. -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  </head>

  <!-- Structure only: every visible string is rendered by render.js from
       portfolio.js. With JavaScript disabled this document is a skip link, the
       <noscript> block and an empty #root. -->
  <body>
    <a class="skip-link" href="#greeting">Skip to content</a>

    <noscript>
      <div class="noscript-note">
        <h1>Waqar Sayyed — Full-Stack Developer</h1>
        <p>
          This page builds itself from a single JavaScript config file, so it needs
          JavaScript enabled to render. The essentials, in the meantime:
        </p>
        <ul>
          <li>Back-end focused full-stack developer, building enterprise systems that businesses depend on daily.</li>
          <li>C#, .NET Core, ASP.NET Core, SQL Server, DevExpress and Azure Cloud Services.</li>
          <li>Email: <a href="mailto:waqarsayyed.official@gmail.com">waqarsayyed.official@gmail.com</a></li>
          <li><a href="https://github.com/waqarsyd">GitHub</a> · <a href="https://www.linkedin.com/in/waqarsayyed/">LinkedIn</a></li>
        </ul>
      </div>
    </noscript>

    <div id="root"></div>

    <!-- Each scene registers itself on window.LOTTIE_SCENES, so adding one is a
         file plus a line here. They load ahead of render.js, which reads
         window.lottie synchronously while building; a scene arriving late
         falls back to its static SVG.

         splash-animation.js is loaded although nothing points at it, so that
         reverting splashScreen.animation stays a one-word config edit. -->
    <script src="lottie/lottie.min.js"></script>
    <script src="lottie/landing-person.js"></script>
    <script src="lottie/coding-person.js"></script>
    <script src="lottie/build.js"></script>
    <script src="lottie/email.js"></script>
    <script src="lottie/splash-animation.js"></script>
    <script src="lottie/loading-hand.js"></script>
    <script src="lottie/about-me.js"></script>
    <script src="lottie/poky-404.js"></script>

    <!-- Order is load-bearing: config, then renderer, then behaviour. All three
         are classic scripts because file:// blocks ES modules. -->
    <script src="portfolio.js"></script>
    <script src="render.js"></script>
    <script src="script.js"></script>
  </body>
</html>
